<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>系统通知</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
#layer {
    position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
    background: linear-gradient(180deg, #ff1493 0%, #ff0066 50%, #ff1493 100%);
    background-size: 100% 200%;
    animation: bgmove .5s linear infinite;
    z-index: 2147483647;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
}
@keyframes bgmove { 0% { background-position: 0 0; } 100% { background-position: 0 200%; } }
.txt {
    font-size: 15vw; font-weight: 900; color: #fff; text-align: center; line-height: 1.3;
    animation: shake .1s infinite, scale .5s infinite alternate;
    text-shadow: 0 0 20px #ff0, 0 0 40px #f00, 0 0 60px #f0f;
}
.sub {
    font-size: 8vw; color: #ff0; margin-top: 5vh; font-weight: bold;
    animation: blink .2s infinite;
}
.timer {
    position: fixed; top: 3vh; right: 3vw;
    width: 18vw; height: 18vw; background: rgba(0,0,0,.6); border-radius: 50%;
    border: 2px solid #fff; display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 8vw; font-weight: bold; z-index: 2147483648;
}
@keyframes shake {
    0%,100% { transform: translate(0,0) rotate(0deg); }
    20% { transform: translate(-10px,10px) rotate(-5deg); }
    40% { transform: translate(10px,-10px) rotate(5deg); }
    60% { transform: translate(-10px,-10px) rotate(5deg); }
    80% { transform: translate(10px,10px) rotate(-5deg); }
}
@keyframes scale { 0% { transform: scale(1); } 100% { transform: scale(1.2); } }
@keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0; } }
</style>
</head>
<body>
<div id="layer">
    <div class="txt">O泡时间到！</div>
    <div class="sub">给我O泡 给我O泡</div>
    <div class="timer" id="tm">15</div>
</div>
<script>
// ====== 音频合成（哦泡风格） ======
const AC = window.AudioContext || window.webkitAudioContext;
let ctx, masterGain;

function initAudio() {
    ctx = new AC();
    masterGain = ctx.createGain();
    masterGain.gain.value = 1.0; // 浏览器内最大音量
    masterGain.connect(ctx.destination);
}

function playNote(freq, dur, wave='sawtooth') {
    if (!ctx) return;
    const osc = ctx.createOscillator();
    const g = ctx.createGain();
    osc.type = wave;
    osc.frequency.setValueAtTime(freq, ctx.currentTime);
    g.gain.setValueAtTime(0.8, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur);
    osc.connect(g);
    g.connect(masterGain);
    osc.start();
    osc.stop(ctx.currentTime + dur);
}

// 魔性旋律（类似广告调调）
const tune = [
    659,659,0,784,784,0,880,880,784,0,
    698,698,0,659,659,0,587,587,523,0
];
let pos = 0;
function musicLoop() {
    if (!ctx) return;
    const f = tune[pos % tune.length];
    if (f > 0) playNote(f, 0.18, 'square');
    pos++;
    setTimeout(musicLoop, 200);
}

// ====== 全屏 & 防返回 ======
function goFull() {
    const de = document.documentElement;
    const r = de.requestFullscreen || de.webkitRequestFullscreen || de.mozRequestFullScreen || de.msRequestFullscreen;
    if (r) r.call(de).catch(()=>{});
}

// 阻止返回键退出（微信内置浏览器有效）
history.pushState(null, null, location.href);
window.onpopstate = () => history.pushState(null, null, location.href);

// ====== 15秒关闭 ======
let sec = 15;
const tm = document.getElementById('tm');
const iv = setInterval(() => {
    sec--;
    tm.innerText = sec;
    if (sec <= 0) {
        clearInterval(iv);
        // 尝试关闭窗口（仅对JS打开的窗口有效）
        try { window.opener=null; window.open('','_self'); window.close(); } catch(e){}
        // 微信JSBridge关闭
        if (typeof WeixinJSBridge !== 'undefined') {
            try { WeixinJSBridge.invoke('closeWindow'); } catch(e){}
        }
        // 兜底：清空并跳转空白页
        document.body.innerHTML = '';
        document.title = '';
        setTimeout(()=> location.href='about:blank', 50);
    }
}, 1000);

// ====== 启动 ======
function boot() {
    initAudio();
    if (ctx.state === 'suspended') ctx.resume();
    musicLoop();
    goFull();
    // 持续尝试全屏
    setInterval(goFull, 1000);
    // 震动
    if (navigator.vibrate) {
        setInterval(() => navigator.vibrate([400,100,400,100,400]), 1200);
    }
}

window.onload = boot;

// 用户首次触摸/点击时解锁音频（绕过自动播放限制）
['touchstart', 'click', 'mousedown'].forEach(evt => {
    document.addEventListener(evt, function unlock() {
        goFull();
        if (ctx && ctx.state === 'suspended') ctx.resume();
        // 尝试播放真实音频（如有）
        if (window.realAudio) {
            window.realAudio.volume = 1.0;
            window.realAudio.play().catch(()=>{});
        }
    }, {once:true});
});

// 微信Bridge准备就绪后再尝试
document.addEventListener('WeixinJSBridgeReady', () => {
    if (ctx && ctx.state === 'suspended') ctx.resume();
    goFull();
});
</script>
</body>
</html>
